seed: 23
device: auto
batch_size: 8
num_workers: 0
image_size: 224
epochs: 15
patience: 4
learning_rate: 0.0001
weight_decay: 0.0001
lr_scheduler: plateau
class_weighting: auto
augmentation:
  horizontal_flip_probability: 0.0
  rotation_degrees: 7
  affine_translate: 0.03
  affine_scale: [0.95, 1.05]
  brightness: 0.05
aggregation_candidates: [mean_probability, max_probability]
selection_metric: auroc

